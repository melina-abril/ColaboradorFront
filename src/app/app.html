@if (currentUser.isAuthenticated()) {
  <button class="skip-link" type="button" (click)="content.focus()">Ir al contenido</button>
  <app-header />
  <div class="app-shell">
    <app-side-nav #sideNav />
    <main #content id="contenido" class="app-content" tabindex="-1">
      <div class="app-content__heading">
        <span class="app-content__eyebrow">PORTAL DEL COLABORADOR</span>
        <h1>{{ sideNav.activeTitle() }}</h1>
      </div>
      <router-outlet />
    </main>
  </div>
  <app-footer />
} @else {
  <router-outlet />
}
